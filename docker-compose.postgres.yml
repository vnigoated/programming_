services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: txnagentbench
      POSTGRES_USER: txnagentbench
      POSTGRES_PASSWORD: txnagentbench-local-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txnagentbench -d txnagentbench"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
