name: benchmark-ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: txnagentbench
          POSTGRES_USER: txnagentbench
          POSTGRES_PASSWORD: txnagentbench-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U txnagentbench -d txnagentbench"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TXNAGENTBENCH_TEST_POSTGRES_DSN: postgresql://txnagentbench:txnagentbench-ci-only@127.0.0.1:5432/txnagentbench
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[test,postgres]"
      - run: python -m pytest -q
      - run: >-
          txnagentbench run
          --config configs/postgres_smoke.json
          --output artifacts/postgres-smoke-ci
          --allow-scripted
        env:
          TXNAGENTBENCH_POSTGRES_DSN: ${{ env.TXNAGENTBENCH_TEST_POSTGRES_DSN }}
      - run: txnagentbench validate --output artifacts/postgres-smoke-ci
      - run: >-
          txnagentbench run
          --config configs/mtpo_smoke.json
          --output artifacts/mtpo-smoke-ci
          --allow-scripted
      - run: txnagentbench validate --output artifacts/mtpo-smoke-ci
      - run: >-
          txnagentbench run
          --config configs/recovery_smoke.json
          --output artifacts/recovery-smoke-ci
          --allow-scripted
      - run: txnagentbench validate --output artifacts/recovery-smoke-ci
